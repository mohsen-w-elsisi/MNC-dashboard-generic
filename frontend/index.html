<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>data-vis-proj-frontend</title>
  </head>
  <body>
    <header>
      <h1>sales board</h1>
      <nav>
        <md-outlined-button id="button-tab-1">over view</md-outlined-button>
        <md-outlined-button id="button-tab-2">Details pie</md-outlined-button>
      </nav>
    </header>

    <main>
      <section id="tab-1">
        <article id="kpis">
          <div class="kpi-box" id="revenue-this-year">
            <span class="kpi-label">Revenue this year</span>
            <strong class="kpi-value">$0</strong>
          </div>

          <div class="kpi-box" id="sales-this-year">
            <span class="kpi-label">Sales this year</span>
            <strong class="kpi-value">0</strong>
          </div>

          <div class="kpi-box" id="global-market-share">
            <span class="kpi-label">Global market share</span>
            <strong class="kpi-value">0%</strong>
          </div>

          <div class="kpi-box" id="operating-countries">
            <span class="kpi-label">Operating countries</span>
            <strong class="kpi-value">0</strong>
          </div>
        </article>

        <article id="bullet-chart"></article>

        <article id="share-price-chart"></article>
      </section>

      <section id="tab-2">
        <article id="filters">
          <h2>Filters</h2>

          <label for="country-dropdown">Country:</label>

          <md-outlined-select id="country-dropdown" name="country" required>
            <md-select-option value="" selected>
              <p slot="headline">All</p>
            </md-select-option>
          </md-outlined-select>

          <label for="product-radio-group">Product:</label>

          <div id="product-radio-group">
            <span>
              <md-radio
                id="all-products"
                name="product"
                value=""
                required="true"
                checked="true"
              ></md-radio>
              <label for="all-products">All</label>
            </span>
          </div>
        </article>

        <article id="market-share-chloropleth"></article>
        <article id="sales-bar-chart"></article>
        <article id="sales-timeseries"></article>
        <article id="market-share-timeseries"></article>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
