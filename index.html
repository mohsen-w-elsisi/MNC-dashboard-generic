<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>data-vis-proj-frontend</title>
  </head>
  <body>
    <header>
      <h1>sales board</h1>
      <nav>
        <button id="button-tab-1">over view</button>
        <button id="button-tab-2">Details pie</button>
      </nav>
    </header>

    <main>
      <section id="tab-1">
        <article id="kpis">
          <div class="kpi-box" id="revenue-this-year">
            <span class="kpi-label">Revenue this year</span>
            <strong class="kpi-value">$0</strong>
          </div>

          <div class="kpi-box" id="sales-this-year">
            <span class="kpi-label">Sales this year</span>
            <strong class="kpi-value">0</strong>
          </div>

          <div class="kpi-box" id="global-market-share">
            <span class="kpi-label">Global market share</span>
            <strong class="kpi-value">0%</strong>
          </div>

          <div class="kpi-box" id="operating-countries">
            <span class="kpi-label">Operating countries</span>
            <strong class="kpi-value">0</strong>
          </div>
        </article>

        <article id="bullet-chart">world</article>
        
        <article id="share-price-chart"></article>
      </section>

      <section id="tab-2">
        <form id="filters"></form>
        <div id="market-share-chloropleth"></div>
        <div id="sales-bar-chart"></div>
        <div id="sales-timeseries"></div>
        <div id="market-share-timeseries"></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
